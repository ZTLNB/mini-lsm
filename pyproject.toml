[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-lsm"
version = "0.3.0"
description = "从零实现的 LSM-Tree 存储引擎:WAL + 内存表 + SSTable + Manifest + 分层归并 + 崩溃恢复(纯 Python,零依赖)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ZTLNB" }]
keywords = ["lsm-tree", "storage-engine", "database", "wal", "write-ahead-log", "sstable", "compaction", "manifest", "key-value-store"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/ZTLNB/mini-lsm"
Repository = "https://github.com/ZTLNB/mini-lsm"
Issues = "https://github.com/ZTLNB/mini-lsm/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
